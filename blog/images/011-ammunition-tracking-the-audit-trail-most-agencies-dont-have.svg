  <!-- Left accent stripe -->
  <rect x="0" y="0" width="5" height="630" fill="#3b82f6" opacity="0.4"/>

  <!-- Category icon (large, faded, decorative) -->
  <g opacity="0.12" transform="translate(555,55)"><rect x="10" y="10" width="60" height="75" rx="5" fill="none" stroke="#3b82f6" stroke-width="2.5"/><rect x="25" y="2" width="30" height="16" rx="3" fill="none" stroke="#3b82f6" stroke-width="2"/><line x1="25" y1="38" x2="55" y2="38" stroke="#3b82f6" stroke-width="2"/><line x1="25" y1="50" x2="55" y2="50" stroke="#3b82f6" stroke-width="2"/><line x1="25" y1="62" x2="45" y2="62" stroke="#3b82f6" stroke-width="2"/></g>

  <!-- Category label -->
  <text x="80" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#3b82f6">OPERATIONAL GUIDE</text>

  <!-- Accent line under category -->
  <rect x="80" y="212" width="60" height="3" rx="1.5" fill="#3b82f6"/>

  <!-- Title -->
  <text x="80" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#f5f5f5" line-height="1.2">
        <tspan x="80" dy="0">Ammunition Tracking: The Audit Trail</tspan>
        <tspan x="80" dy="48">Most Agencies Don&#39;t Have</tspan>
  </text>

  <!-- Bottom section divider -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#333" stroke-width="1"/>

  <!-- BrassOps brand -->
  <text x="80" y="580" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2">
    <tspan fill="#ededed">Brass</tspan><tspan fill="#ef4444">Ops</tspan>
  </text>

  <!-- Tagline -->
  <text x="80" y="604" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666" letter-spacing="1">RANGE INTELLIGENCE FOR LAW ENFORCEMENT</text>

  <!-- brassops.com -->
  <text x="1120" y="580" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555" text-anchor="end">brassops.com</text>

  <!-- Corner accent -->
  <rect x="1150" y="0" width="50" height="5" fill="#3b82f6" opacity="0.6"/>
  <rect x="1195" y="0" width="5" height="50" fill="#3b82f6" opacity="0.6"/>
